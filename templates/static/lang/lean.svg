    <clipPath id="n"><rect x="65" y="64" width="50" height="51"/></clipPath>
  </defs>
  <g fill="#2f63d0">
    <!-- L -->
    <rect x="15" y="13" width="8" height="50"/>
    <rect x="15" y="55" width="48" height="8"/>
    <!-- ∃ -->
    <rect x="65" y="13" width="50" height="8"/>
