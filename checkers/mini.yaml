description: |
  A small, naive and incomplete implementation of a Lean kernel from scratch.
  
  This is mostly an exercise to improve the test coverage on the arena.
  Runs with a 30s timeout.
language: lean
url: https://github.com/nomeata/lean-mini-kernel
ref: master
rev: 3a88e8c23b5135151f37eac4009ce94d6df5efd8
build: lake build
run: .lake/build/bin/mini-kernel "$IN"
timeout: 30
# Cannot handle the full Init.Prelude, so decline everything built on top of it
declines:
  - init-prelude
  - init
  - std
  - mathlib
  - cedar
  - cslib
  - renovation
