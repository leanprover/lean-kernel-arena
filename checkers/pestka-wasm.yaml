description: |
  **pestka-wasm** is the [Pestka](https://github.com/jasisz/pestka) kernel as
  WebAssembly. The same Aver source as the `pestka` entry is compiled by
  [Aver](https://github.com/jasisz/aver)'s own wasm-gc backend (not through
  Rust or LLVM) and runs on V8 under Node. Terms, maps and closures are
  objects of the engine's garbage collector, and the module is about 0.6 MB.
  It gives the same answers as `pestka`; the gap between the two entries is
  what a garbage-collected wasm target costs a Lean kernel, and Aver's
  backend keeps working on it.

  As in `pestka`, the export is first converted to
  [Susz](https://github.com/jasisz/susz) by the native `susz` converter,
  which is not trusted. Declarations are then checked on one thread, grouped
  by namespace, with `--low-memory`: Pestka's caches stay bounded, which
  under the garbage collector costs no extra work. `bin/run-wasm` passes on
  Pestka's exit status only when its verdict line agrees with it, and exits
  with 3 otherwise, so a crash of V8 or of the host never reads as a verdict.

  The build installs `susz` 0.1.0 and the Aver release pinned in
  `.aver-version` from crates.io, and optimizes the module for speed with
  Binaryen's `wasm-opt`.
language: aver
url: https://github.com/jasisz/pestka
ref: main
rev: f8e48a7ddee20ebfe9bfeb3a81ae2b87763c374c
build: |
  RUSTFLAGS="-C target-cpu=native" cargo install susz --version 0.1.0 --locked --root "$PWD/.susz"
  cargo install aver-lang --version "$(cat .aver-version)" --locked --features wasm --root "$PWD/.aver"
  AVER="$PWD/.aver/bin/aver" bin/build-wasm
run: bin/arena-run --wasm "$IN" 1
threads: 1
