description: |
  **pestka-wasm** is the [Pestka](https://github.com/jasisz/pestka) kernel as
  WebAssembly. The same Aver source as the `pestka` entry is compiled by
  [Aver](https://github.com/jasisz/aver)'s own wasm-gc backend (not through
  Rust or LLVM) and runs on V8 under Node. Terms, maps and closures are
  objects of the engine's garbage collector, and the module is about 0.4 MB.
  It gives the same answers as `pestka`; the gap between the two entries is
  what a garbage-collected wasm target costs a Lean kernel, and Aver's
  backend keeps working on it.

  Declarations are checked in file order on one thread. `bin/run-wasm`
  passes on Pestka's exit status only when its verdict line agrees with it,
  and exits with 3 otherwise, so a crash of V8 or of the host never reads
  as a verdict.

  The build installs the Aver release pinned in `.aver-version` from
  crates.io and optimizes the module for speed with Binaryen's `wasm-opt`.
url: https://github.com/jasisz/pestka
ref: main
rev: 4fbe9d1c7d76fe8e534a1aa07df1f4f483face23
build: |
  cargo install aver-lang --version "$(cat .aver-version)" --locked --features wasm --root "$PWD/.aver"
  AVER="$PWD/.aver/bin/aver" bin/build-wasm
run: bin/run-wasm "$IN" 1
threads: 1
