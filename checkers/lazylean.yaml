description: |
  **lazylean** — a Lean 4 kernel in C++ whose reduction engine is a lazy
  abstract machine in the style of the Coq kernel's `cClosure`, rather than
  Lean's substitution-based `whnf`.

  - The type-checking algorithm is Lean's own (`is_def_eq`, lazy delta
    reduction with reducibility hints, proof irrelevance, eta, K-like
    recursors, `Nat`/`String` literals with GMP), cross-checked against
    lean4lean; recursors are re-derived from the inductive specification and
    compared with the exported ones.
  - Weak-head normalisation runs a Krivine machine: closures over
    environments, call-by-need thunks overwritten with their value when first
    forced, constant C++ stack, reference-counted memory proportional to the
    live data.
  - Lean's compiled `match`/`brecOn` wrapper chains are fused once per
    definition, and structurally recursive definitions get Coq-style fixpoint
    rules that the kernel verifies with `is_def_eq` before using them.
  - `Lean.reduceBool`/`reduceNat` (native reduction) are declined.
  - Declarations are checked by worker processes forked after the export has
    been parsed, so the parse and the interned terms are shared rather than
    repeated; the export's declaration order is verified first, so that no
    worker can be shown a constant introduced after the one it is checking.

  Written by Claude (Anthropic), directed by Chris Emery.
version: "0.3.0"
url: https://github.com/corun1024/lazylean
ref: v0.3.0
rev: 68c66fa18c1afe029512b90ecfe0b162c0dcd8fb
build: |
  cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
  cmake --build build -j
threads: 4
# Exit codes are the arena's: 0 accept, 1 reject, 2 declined.  --max-rss makes a
# declaration that outgrows the runner's memory a decline rather than a kill; the
# arena scores the timeout like a decline too.  -j 4 checks four declarations at a
# time, each in its own process, over one parse of the export; reduction inside a
# declaration stays sequential, so it is only the large corpora that gain.
run: build/lazylean -j 4 --max-rss 14000 "$IN"
timeout: 3600
