description: |
  **Pestka** is a type checker for Lean 4 exports written in
  [Aver](https://github.com/jasisz/aver), a statically typed language
  designed for AI to write and humans to review, which compiles to Rust.
  It implements Lean's type theory on its own (universe levels,
  definitional equality, inductive types with their recursors, quotients,
  and the Nat and String literal extensions), following the reference
  kernel's substitution-based algorithm, without NbE, to see how far that
  algorithm can be pushed. It was written by an AI agent under human guidance.

  The export is first converted to [Susz](https://github.com/jasisz/susz),
  a binary form of lean4export's ndjson, by the `susz` converter (Rust).
  The converter is not trusted: Susz holds structure only, and Pestka checks
  every reference, count and offset itself. An export the converter finds
  invalid is rejected, one it cannot convert is declined. Pestka keeps the
  proofs as bytes until their theorem is checked.

  Declarations are checked on four workers, each keeping what it finds from
  one declaration to the next, grouped by namespace so that this is reused
  while still warm. A free variable is named by its type, value and how many
  of its kind are open, so a binder opened again gets the same variable and
  what was found under it holds again. Proof arguments of one constant are
  not compared. Weak head normalization runs a lazy machine that unfolds a
  matcher into its callers once and goes from a casesOn straight to its
  branch. A recursive definition that keeps unfolding gets a rule, derived
  once by reducing it on fresh variables, which later calls take instead of
  unfolding it.

  The build installs `susz` 0.1.0 and the Aver release pinned in
  `.aver-version` from crates.io, and builds Pestka with a profile from
  checking `Init`. The same source compiled to WebAssembly is the
  `pestka-wasm` entry.
language: aver
url: https://github.com/jasisz/pestka
ref: main
rev: f8e48a7ddee20ebfe9bfeb3a81ae2b87763c374c
build: |
  RUSTFLAGS="-C target-cpu=native" cargo install susz --version 0.1.0 --locked --root "$PWD/.susz"
  cargo install aver-lang --version "$(cat .aver-version)" --locked --root "$PWD/.aver"
  ROOT=$(cd ../../../.. && pwd)
  "$ROOT/lka.py" build-test init
  .susz/bin/susz pack --no-index "$ROOT/_build/tests/init.ndjson" "$PWD/init.susz"
  AVER="$PWD/.aver/bin/aver" FLAGS="-C target-cpu=native" bin/build-pgo "$PWD/init.susz"
  rm -f "$PWD/init.susz"
run: bin/arena-run "$IN" 4
threads: 4
