description: |
  **kiota** — a from-scratch Lean 4 kernel in Rust that re-derives
  K-likeness and ι instead of trusting those export fields. Not a
  nanoda fork. Experimental fragment: large corpora declined (same
  policy as mini) until Init.Prelude typechecks honestly.
version: "0.1.0"
url: https://github.com/sankalpsthakur/kiota
ref: main
rev: 343dfbc6b37fe72d0a010675befa59a711df5383
build: cargo build --release
run: timeout 30s ./target/release/kiota "$IN"
# Full Init / mathlib still out of reach. Prelude now typechecks.
declines:
  - init
  - std
  - mathlib
  - cslib
  - cedar
  - nested-nonuniform-param
