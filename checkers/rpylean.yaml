version: "v2026.11.6"
description: |
  **rpylean** - A Lean type checker written in (R)Python.
language: python
url: https://github.com/Julian/rpylean
ref: main
rev: 769f42b7ff75b71cccaa7303b6df91df5e9a5093
build: |
  git clone --filter=blob:none https://github.com/pypy/pypy
  cat > .env <<__END__
   PYPY_CHECKOUT=pypy/
  __END__
  just translate
run: |
  ./rpylean-c check "$IN"
# The renovation tests need support for the inductive flags of export format 3.2.0
declines:
  - renovation
