version: "v2026.11.2"
description: |
  **rpylean** - A Lean type checker written in (R)Python.
language: python
url: https://github.com/Julian/rpylean
ref: main
rev: dd8949ef877091c9f76294de13b215f77d36248d
build: |
  git clone --filter=blob:none https://github.com/pypy/pypy
  cat > .env <<__END__
   PYPY_CHECKOUT=pypy/
  __END__
  just translate
run: |
  ./rpylean-c check "$IN"
# rpylean's peak memory on Mathlib exceeds the 16 GB available on arena CI
# runners.
declines: mathlib
