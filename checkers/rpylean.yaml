version: "v2026.11.11"
description: |
  **rpylean** - A Lean type checker written in (R)Python.
language: python
url: https://github.com/Julian/rpylean
ref: main
rev: bbf354d3adbfe84d297ea2159cc707b48d96a90a
build: |
  git clone --filter=blob:none https://github.com/pypy/pypy
  cat > .env <<__END__
   PYPY_CHECKOUT=pypy/
  __END__
  just translate
run: |
  ./rpylean-c check "$IN"
