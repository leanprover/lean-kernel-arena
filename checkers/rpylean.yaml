version: "v2026.9.1"
description: |
  **rpylean** - A Lean type checker written in (R)Python.
url: https://github.com/Julian/rpylean
ref: main
rev: 463a3101197fa7db733cc6e2d4f55767ef3b3713
build: |
  git clone --filter=blob:none https://github.com/pypy/pypy
  cat > .env <<__END__
   PYPY_CHECKOUT=pypy/
  __END__
  just translate
run: |
  ./rpylean-c check "$IN" || exit 1
# rpylean does not pass on Mathlib yet; running it costs about an hour per
# arena run for an already-known outcome.
declines: mathlib
