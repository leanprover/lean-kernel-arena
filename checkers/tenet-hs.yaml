description: |
  [**tenet-hs**](https://github.com/keithadler/tenet-hs) is an independent implementation of the Lean 4
  kernel in Haskell, written from the type theory and the reference kernel's behavior rather than
  translated from it. It is a sibling of [Tenet](https://github.com/keithadler/tenet), the .NET
  implementation, and the two are maintained together: the more independent kernels there are, the
  more chances to find a bug in the reference kernel, in the others, or in the specification they
  are all trying to match.

  It reads lean4export NDJSON, re-derives every constructor and recursor (nested and mutual
  inductives included) and compares them field for field with what the exporter wrote, and has no
  dependencies beyond the libraries that ship with GHC.

  Everywhere it deliberately decides something differently from Lean is written down in
  `docs/divergences.md`. Two matter here: it checks that the constant named `Nat.add` behaves like
  addition before taking the arithmetic shortcut named after it, and it refuses a numeric literal
  unless the environment's `Nat` is the inductive the literal denotes. Both are extra checks on the
  prelude of the kind the arena's README permits. `Lean.reduceBool` and `Lean.reduceNat` are
  declined.

  It is single-threaded and slower than the other independent kernels; the reasons, with
  measurements, are in `docs/design.md`.

  Written by Claude (Anthropic), directed by Keith Adler.
url: https://github.com/keithadler/tenet-hs
ref: main
rev: b9b424827febc8ebb1e2aea3dbcacef185278084
version: "0.1.1"

# One worker: declarations are checked in order, in one thread, so the default of one CPU slot is
# the honest declaration.
# `ghc` comes from the arena's own flake; the checker needs nothing beyond the libraries that ship
# with it, so there is no cabal and no package download. The flags are the extensions the cabal file
# turns on for every module.
build: |
  ghc -O2 -isrc -iapp -outputdir arena-obj -o tenet-hs-arena \
    -XGHC2021 -XPatternSynonyms -XViewPatterns -XLambdaCase -XBangPatterns \
    -XOverloadedStrings -XMultiWayIf -XTupleSections \
    -rtsopts "-with-rtsopts=-K2g -A64m" app/Main.hs
run: |
  # 0 accept, 1 reject, 2 decline. tenet-hs agrees on the first two and uses 4 for declining, which
  # is what it does when a file asks it to trust the output of compiled code: not a claim the proof
  # is invalid, a refusal to vouch for it. Anything else means the checker could not process the
  # file, which is an error and is left to surface as one rather than being hidden as a decline.
  c=0
  ./tenet-hs-arena check "$IN" --summary || c=$?
  case $c in
    0|1) exit $c ;;
    4)   exit 2 ;;
    *)   exit 9 ;;
  esac

# The full corpora below have not been run, and so are not claimed. The largest checks so far are all of
# Init (57,919 declarations, 48 s, 0.84 GB peak) and a 405,144-declaration slice of Mathlib across 19 areas
# (463 s, 4.2 GB peak). These are larger still, tenet-hs checks on one thread, and its memory on inputs of
# that size is projected and not measured, so declining them avoids spending the runner's hours on a result
# that is more likely a timeout. They will be enabled once they have been measured.
declines:
  - mathlib
  - cslib
  - cedar
  - con-leche
  - navier-stokes-euler
