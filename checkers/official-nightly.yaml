version: "nightly-2026-11-14"
description: |
  The official Lean 4 kernel checker implementation (nightly release).
language: cpp
build: |
  echo leanprover/lean4:nightly-2026-11-14 > lean-toolchain
  lean --version
run: leanchecker --from-export "$IN"
# The renovation tests need support for the inductive flags of export format 3.2.0
declines:
  - renovation
