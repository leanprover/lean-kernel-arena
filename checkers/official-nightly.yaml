version: "nightly-2026-11-14"
description: |
  The official Lean 4 kernel checker implementation (nightly release).
language: cpp
build: |
  echo leanprover/lean4:nightly-2026-11-14 > lean-toolchain
  lean --version
run: leanchecker --from-export "$IN"
# The nightly releases predate the kernel renovation (lean4#16595), and all tests
# of the preview are exported with its inductive flags
disable: true
