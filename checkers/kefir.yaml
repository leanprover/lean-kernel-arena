description: |
  **K**ernel **E**nforcing **F**ormal **I**nference **R**ules — an independent
  external proof checker for Lean 4, in Rust, built for low peak memory.
  Declarations are checked as they stream in and their terms are freed once
  checked; expressions are stored compactly, and most caches are small
  fixed-size tables that overwrite on collision. Conversion runs on an
  environment-based evaluator with call-by-need sharing; anything it cannot
  confirm is rechecked by a substitution-based checker. Hot definitions get
  reduction rules derived from their own bodies. Recursors are re-derived and
  must match the export exactly. Single-threaded.
version: "e00bbd5"
url: https://github.com/dmitrykorolev/kefir
ref: main
rev: e00bbd5bf5f3bc2a1c6d6aa0c9e6b29584763d79
build: |
  set -eu
  ROOT=$(cd ../../../.. && pwd)
  "$ROOT/lka.py" build-test init-prelude
  rm -rf pgo target-pgo-generate target-pgo-use
  RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" \
    cargo build --release --locked --target-dir target-pgo-generate
  IN="$ROOT/_build/tests/init-prelude.ndjson" \
    ./target-pgo-generate/release/kefir --axiom-policy=allow-all-declared-axioms >/dev/null
  llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
  RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" \
    cargo build --release --locked --target-dir target-pgo-use
run: ./target-pgo-use/release/kefir --axiom-policy=allow-all-declared-axioms
threads: 1
