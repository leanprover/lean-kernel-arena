description: |
  A parallel Lean 4 kernel written in Rust using hash-consing and de Bruijn indices
language: rust
url: https://github.com/sdiehl/nano-lean
ref: v0.4.0
rev: faef321a7ab9fd9ea67a6d8d52d84ee27cd80266
build: |
  RUSTFLAGS="-C target-cpu=native -C llvm-args=-align-all-functions=6" cargo build --release --locked --bin nl-fast
run: target/release/nl-fast -q -j 4 "$IN"
threads: 4
