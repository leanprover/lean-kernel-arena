description: |
  A parallel Lean 4 kernel written in Rust using hash-consing and de Bruijn indices
language: rust
url: https://github.com/sdiehl/nano-lean
ref: v0.3.3
rev: 5c8a523de8d021662e024266013cbb693a5885f6
build: |
  ROOT=$(cd ../../../.. && pwd)
  "$ROOT/lka.py" build-test init
  FLAGS="-C target-cpu=native -C llvm-args=-align-all-functions=6"
  RUSTFLAGS="$FLAGS -Cprofile-generate=$PWD/pgo" cargo build --release --locked --bin nl-fast
  target/release/nl-fast -q -j 4 "$ROOT/_build/tests/init.ndjson" >/dev/null
  llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
  RUSTFLAGS="$FLAGS -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release --locked --bin nl-fast
run: target/release/nl-fast -q -j 4 "$IN"
threads: 4
