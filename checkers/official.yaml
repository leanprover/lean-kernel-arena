version: "v4.35.0"
description: |
  The official Lean 4 kernel checker implementation.
language: cpp
build: |
  echo leanprover/lean4:v4.35.0 > lean-toolchain
  lean --version
run: leanchecker --from-export "$IN"
# The renovation tests need support for the inductive flags of export format 3.2.0
declines:
  - renovation
