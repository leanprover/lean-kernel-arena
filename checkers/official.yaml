version: "pr-16595-cb63311"
description: |
  The official Lean 4 kernel checker implementation, from the PR release of the
  kernel renovation ([lean4#16595](https://github.com/leanprover/lean4/pull/16595))
  at cb63311, which handles the inductive flags of export format 3.2.0.
language: cpp
build: |
  echo leanprover/lean4-pr-releases:pr-release-16595-cb63311 > lean-toolchain
  lean --version
run: leanchecker --from-export "$IN"
