description: |
  MathGraph's Lean checker is a testbed for verifier-preserving checker
  development. It is gratefully based on Jeremy Chen's
  [sokonanoda](https://github.com/intgrah/sokonanoda), itself part of the
  nanoda-family lineage.

  At present MathGraph remains close to sokonanoda; it is not an independent
  rewrite, and no such claim is intended. The retained MathGraph line includes
  additional recursor validation for newer Arena tests, repairs to deep
  environment keying and pruning, targeted unfolding and conversion
  optimizations, and removal of redundant work found through profiling and
  differential testing.

  This revision additionally avoids forcing an inferred function type when it
  is already a Pi type, and uses two worker threads. A larger architectural
  rewrite is future work rather than something claimed by this submission.

  Maintained by [Metalogic Labs](https://mathgraph.org/).
version: "flash"
language: rust
url: https://github.com/metalogiclabs/mathgraph-lean-kernel
ref: flash
rev: 78c7502bac8a5ba000057b3f083bc0595ac65750
build: |
  cat > config.json <<__END__
   {
     "use_stdin": true,
     "nat_extension": true,
     "string_extension": true,
     "unpermitted_axiom_hard_error": false,
     "unsafe_permit_all_axioms": true,
     "num_threads": 2
   }
  __END__
  ROOT=$(cd ../../../.. && pwd)
  "$ROOT/lka.py" build-test init-prelude
  RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release
  target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
  llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
  RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release
run: |
  target/release/sokonanoda config.json < "$IN" || exit 1
