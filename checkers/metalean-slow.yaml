description: |
  Verified typechecker designed for algorithmic simplicity over speed.
  Declines to handle nat/string literals, or accelerated operations.
  It also cannot handle nested inductives, but those are filtered out, so
  it is possible that a test containing nested inductives will cause this checker to
  incorrectly accept.
url: https://github.com/intgrah/metalean
ref: master
rev: cc8ccb6036e30ed0510ef7bbdc9b0a5dc85b2f9d
build: |
  lake build metalean
  cargo build --release --manifest-path scripts/filter/Cargo.toml
run: |
  FILTERED=$(mktemp --suffix=.ndjson)
  trap 'rm -f "$FILTERED"' EXIT
  scripts/filter/target/release/filter "$IN" "$FILTERED" || exit 3
  .lake/build/bin/metalean slow "$FILTERED"
