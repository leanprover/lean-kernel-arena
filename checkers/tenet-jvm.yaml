description: |
  [**tenet-jvm**](https://github.com/keithadler/tenet-jvm) is an independent implementation of the
  Lean 4 kernel in Java, written from the type theory and the reference kernel's behavior rather than
  translated from it. It is a sibling of [Tenet](https://github.com/keithadler/tenet) (.NET) and
  [tenet-hs](https://github.com/keithadler/tenet-hs) (Haskell), and the three are maintained together:
  the more independent kernels there are, the more chances to find a bug in the reference kernel, in
  the others, or in the specification they are all trying to match.

  It reads lean4export NDJSON and does not believe the export for anything it can derive: from the
  types and constructor types alone it regenerates every recursor, recursor rule and bookkeeping flag
  (mutual and nested inductives included, by introducing and translating back the auxiliary types) and
  rejects the file on any difference. The quotient constants are compared with their canonical types.
  It has no dependencies beyond a JDK.

  The process fails closed: the verdict starts as "error" and becomes "accepted" only after a
  non-empty export with a metadata record has been processed in full, and any exception, including an
  out-of-memory error, is a non-zero exit. A crash can therefore never read as acceptance.

  Everywhere it deliberately decides something differently from Lean is written down in
  `docs/divergences.md`. Two matter here: universe levels are compared by case-splitting on the
  parameters under an `imax`, so `Sort (imax 1 0)` is a proposition, and a type whose sort does not
  reduce to a `Sort` is an error rather than "not a proposition" (lean4#14807). `Lean.reduceBool` and
  `Lean.reduceNat` are not evaluated; a proof that needs them is rejected, not declined.

  It is single-threaded. On the author's laptop it checked all of Mathlib (Lean 4.34.1 export) in about
  824 s with a peak footprint near 10 GB; it has not been tried on Linux or in the arena's own runner.

  Written by Claude (Anthropic), directed by Keith Adler.
language: java
url: https://github.com/keithadler/tenet-jvm
ref: main
rev: 264ddbd4e409569d8c0d28140f387a06eda68ca7
version: "0.1.3"

# One worker: declarations are checked in order, in one thread. The JVM's own helper threads (garbage
# collector, JIT) are not counted, so the default of one CPU slot is the honest declaration.
# `jdk` comes from the arena's own flake. Plain javac, no build tool and no package download.
build: make
# 0 accept, 1 reject, 3 internal error or unreadable input. The launcher passes the JVM options the
# checker wants (throughput collector, most of the RAM); the checker itself runs in a large-stack thread.
run: bin/tenet-jvm "$IN"
