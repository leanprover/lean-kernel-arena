description: |
  **Gruszka** is a Lean 4 kernel written in Rust. It implements Lean's type
  theory independently and decides definitional equality by normalization by
  evaluation (NbE). Its only input format is
  [Susz](https://github.com/jasisz/susz), a binary form of lean4export's
  ndjson. It was written by an AI agent under human guidance.

  Terms are never built: environment expressions remain Susz ids, proof
  blocks stay as bytes until their theorem is checked, and the checker works
  with values in worker-local arenas. Values, environments and spines are
  hash-consed, so repeated computations share an id and their cached
  weak-head forms and types. What not to compute comes from
  [Pestka](https://github.com/jasisz/pestka), a substitution-based kernel
  that measured it first: an argument its binder never reads is never
  evaluated, proof arguments are not compared once the arguments before them
  agree, and a casesOn reduces only its major premise.

  A worker keeps its values for a session of many declarations, so later
  declarations find the work of earlier ones. A session only moves forward
  in file order, and facts kept longer are stamped with the declaration that
  made them and used only after it, so nothing travels back.

  Declarations are grouped by namespace and checked on four workers. Each
  worker takes a contiguous part of that order, and one that runs out takes
  half of the largest part left. The verdict remains the first failure in
  file order and does not depend on the worker count.

  Inside one heavy declaration, a whnf call whose result reaches few of the
  values it made gives the rest back, so a long kernel computation runs in
  bounded memory, and a closed computation past 2^26 values goes on in a
  call-by-need machine. Where the reference's order of lazy delta would
  start a closed computation that the two sides do not need, Gruszka changes
  only the order of its steps: a Nat operation waits while the other side
  can still unfold, and past a budget a head common to both sides is tried
  first.

  The export is first converted to Susz by `susz pack` (Rust, from
  crates.io); an export the converter finds invalid is rejected, one it
  cannot convert is declined. The converter is not trusted: Gruszka treats
  the whole file, including the prelude, as untrusted, bounds-checks every
  reference it reads, and builds the quotient package and every recursor
  itself before comparing them with the file.
language: rust
url: https://github.com/jasisz/gruszka
ref: main
rev: ebc80dcb20786d4f25335146b8a9fe8f398843c1
build: |
  RUSTFLAGS="-C target-cpu=native" cargo install susz --version 0.1.4 --locked --root "$PWD/.susz"
  curl -sSfL -o init.susz https://huggingface.co/datasets/jasisz/susz/resolve/108beeec4e2524eeee237330ec6dd99ee2e50216/susz-0.1/init.susz
  echo "b775c241147ff359c4b50aceef2f47282dad9123ecb9f39e28b3c4db21d638d4  init.susz" | sha256sum -c
  FLAGS="-C target-cpu=native" scripts/build-pgo.sh "$PWD/init.susz"
  rm -f init.susz
run: scripts/arena-run "$IN" 4
threads: 4
