description: |
  One convertibility subproblem reached 2^n times. Does the checker share the
  answer, or solve every occurrence afresh?

  Write `#k` for the numeral `N.S (... N.O)` with k successors. `perfect #k t`
  builds the perfect binary tree of depth k with leaves `t`. Each of its k steps
  duplicates the tree so far into both arguments of `Tr.node`, so the result has
  2^k leaves and a representation of size k.

  The two sides are

      perfect #n leaf      and      perfect #(n-1) (node leaf leaf)

  Both reduce to the perfect tree of depth n. Descending them meets
  `Tr.node u u` against `Tr.node v v` at every level, where both argument
  positions pose the same subproblem, u against v. So the recursion reaches 2^n
  pairs of nodes, of which n are distinct. Recording proved pairs answers in
  **Θ(n)**; solving each occurrence afresh answers in **Θ(2ⁿ)**.

  From Courant and Leroy, "A Lazy, Concurrent Convertibility Checker",
  POPL 2026, §10, where Rocq spends 0.018s and the paper's checker 9 × 10⁻⁵s.

  `perfect` uses `N.rec` directly, so the exported definition is one recursor
  application with no `brecOn` in between. The size parameter is the single
  `let n :=` in the `run_elab`. This file scales by stepping n up by one: that
  doubles the cost for a checker without sharing, and adds a constant for one
  with it.
leanfile: tests/perf/repeated-subproblem.lean
export-decls: ["kernel_repeated_subproblem"]
outcome: accept
compare-perf: true
