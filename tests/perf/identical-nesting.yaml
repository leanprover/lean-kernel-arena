description: |
  The declaration to check compares

      f4 (f4 (... (f4 N.O) ...))      and      f4 (f4 (... (f4 N.O) ...))

  n applications of `f4` on each side, the same term twice, where `f0` is the
  identity on `N` and each of `f1`, `f2`, `f3`, `f4` applies its predecessor
  twice, so the nesting expands into 16n applications of `f0`.

  The test asks whether a checker compares the two sides before it starts
  unfolding, which answers in **Θ(n)**. Unfolding one side at a time offers 16n
  applications to choose from per side, and the reachable pairs of partially
  unfolded sides grow exponentially in n.

  N=30 in the Lean source. From Courant and Leroy, POPL 2026, §10.
leanfile: tests/perf/identical-nesting.lean
export-decls: ["kernel_identical_nesting"]
outcome: accept
compare-perf: true
