description: |
  The declaration to check compares

      tagged (count #n)      and      (count #n, false)

  where `count #k` evaluates to the numeral `#k` in Θ(k²) reductions, reaching
  its head constructor alone takes Θ(k), and `tagged m` is `(m, isZero m)`.

  Unfolding `tagged` gives `(count #n, isZero (count #n))`, whose two
  occurrences of `count #n` are one shared subterm. Settling the second
  components reduces that subterm to its head constructor, in Θ(n), and leaves
  `count #n` against `count #n`. The test asks what the shared occurrence holds
  by then: still the folded application, settled by identity for **Θ(n)**, or
  its weak head normal form, leaving two numerals to evaluate for **Θ(n²)**.

  N=1000 in the Lean source. From Courant and Leroy, POPL 2026, §10.
leanfile: tests/perf/folded-constant.lean
export-decls: ["kernel_folded_constant"]
outcome: accept
compare-perf: true
