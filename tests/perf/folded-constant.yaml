description: |
  The same constant application appears in two subproblems, and the first
  subproblem reduces it. Does the second still see the folded form?

  Write `#k` for the numeral `N.S (... N.O)` with k successors. `count #k`
  evaluates to `#k` in Θ(k²) reductions, since each of the k steps adds one to
  the numeral so far and `N.add` recurses on its first argument; reaching the
  head constructor alone takes Θ(k). `tagged m` is the pair `(m, isZero m)`, so
  unfolding `tagged` duplicates its argument.

  The two sides are

      tagged (count #n)      and      (count #n, false)

  Unfolding `tagged` gives `(count #n, isZero (count #n))`, whose two
  occurrences of `count #n` are one shared subterm. Settling the second
  components, `isZero (count #n)` against `false`, reduces that subterm to its
  head constructor, in Θ(n). The first components are then `count #n` against
  `count #n`: identical, for **Θ(n)** overall, if the shared subterm still
  carries its folded form, and two numerals to evaluate, for **Θ(n²)**, if it
  now holds the weak head normal form.

  From Courant and Leroy, "A Lazy, Concurrent Convertibility Checker",
  POPL 2026, §10, where Rocq spends 0.078s and the paper's checker 2 × 10⁻⁴s.

  `N.add`, `count` and `isZero` use `N.rec` directly, so each exported
  definition is one recursor application with no `brecOn` in between. Reduction
  nests Θ(n) deep. The size parameter is the single `let n :=` in the
  `run_elab`; running at n, 2n, 4n separates exponent 1 from exponent 2.
leanfile: tests/perf/folded-constant.lean
export-decls: ["kernel_folded_constant"]
outcome: accept
compare-perf: true
