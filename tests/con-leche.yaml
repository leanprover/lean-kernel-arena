description: |
  The [con-leche](https://github.com/leanprover/con-leche) development's
  three theorems: the consistency proof of its verified checker —
  `model_exists`, every environment the checker accepts has a
  set-theoretic model, and its corollary `no_proof_of_False`, no proof of
  `False` is accepted — and the equivalence of its byte-level parser with
  a naive reference (`scanLineSpec_eq_scanLineFwd`), each with its
  dependency cone.
