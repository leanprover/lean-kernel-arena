description: |
  Unit-like eta for a structure whose fields are proofs, `Unit`, and (after
  instantiating the parameters) a function into a unit-like structure.

  If eta for unit-like types (any two inhabitants are convertible) applies
  only to structures without fields, conversion is not transitive: both `p`
  and `q` are convertible to the same canonical inhabitant (e.g.
  `fun _ => ()` or `⟨()⟩`), but not to each other. Extending the criterion
  to Pi types whose codomain is unit-like and to structures whose fields are
  all proofs or unit-like fixes that. See
  <https://github.com/leanprover/lean4/pull/15372> for a proposal to do this
  in the official kernel, <https://github.com/leanprover/lean4/issues/2258>
  and the overall plan in
  <https://github.com/leanprover/lean4/issues/14977>.
leanfile: tests/corner-cases/eta-unit-like.lean
export-decls: ["unitLikeNested"]
outcome: either
