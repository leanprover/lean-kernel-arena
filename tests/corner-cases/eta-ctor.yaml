description: |
  Function eta between a partially applied constructor and a free variable.
  A checker that eta-expands only when the other side is a lambda rejects
  this, but a checker may accept the equality by expanding the functions.
  See https://github.com/leanprover/lean4/issues/12520 for a discussion, and
  https://github.com/leanprover/lean4/pull/15373 for a proposal to eta-expand
  partially applied constructors in the official kernel. For a bug in a draft
  of that change, see `bugs/eta-ctor-alias`.
leanfile: tests/corner-cases/eta-ctor.lean
export-decls: ["etaCtor"]
outcome: either
