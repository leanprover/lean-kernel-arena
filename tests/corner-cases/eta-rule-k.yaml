description: |
  Function eta between a partially applied recursor with rule K and a free
  variable. The official kernel does not trigger eta expansion here, but a
  checker may accept the equality by expanding the functions.
  See https://github.com/leanprover/lean4/issues/12520 for a discussion; the
  official kernel may adopt eta-expansion of such partial recursor
  applications, see https://github.com/leanprover/lean4/pull/15374. The same
  issue for a structure recursor is `corner-cases/eta-rec-struct`.
leanfile: tests/corner-cases/eta-rule-k.lean
export-decls: ["etaRuleK"]
outcome: either
