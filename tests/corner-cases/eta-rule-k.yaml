description: |
  Function eta between a partially applied recursor with rule K and a free
  variable. A checker that eta-expands only when the other side is a lambda
  rejects this, but a checker may accept the equality by expanding the
  functions.
  See https://github.com/leanprover/lean4/issues/12520 for a discussion, and
  https://github.com/leanprover/lean4/pull/15374 for a proposal to eta-expand
  such partial recursor applications in the official kernel. The same
  issue for a structure recursor is `corner-cases/eta-rec-struct`.
leanfile: tests/corner-cases/eta-rule-k.lean
export-decls: ["etaRuleK"]
outcome: either
