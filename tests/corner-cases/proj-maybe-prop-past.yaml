description: |
  The same as `corner-cases/proj-maybe-prop`, for a projection that has to step
  over a field that may be data.

  The exported definition projects out `MaybeProp.tail : True`, the third
  field. Reaching it means walking past `field : PUnit.{u}`, which the next
  field, `proof`, depends on. As `MaybeProp` is exported with `hasProjections`
  (lean4#16595), all its fields can be projected out, and a checker must accept
  this.

  Before the kernel renovation, the outcome of this test was open: a checker
  that treated `MaybeProp` as a possible proposition applied the check on a
  genuine proposition (the tutorial's `projProp6`), which rejects stepping past
  a data field that a later field depends on, and so rejected this projection
  at field 0 rather than at field 2. See
  <https://github.com/leanprover/lean4/issues/7637> for discussion.
leanfile: tests/corner-cases/proj-maybe-prop.lean
export-decls: ["projMaybePropPast"]
outcome: accept
