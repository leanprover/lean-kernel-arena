description: |
  Projecting out of a structure that may or may not be a proposition.

  `MaybeProp` is a structure whose sort is a bare level parameter: a
  proposition for `u := 0` and a data type for every other `u`. Lean's
  `inductive` command refuses to declare one ("the resulting universe is not
  `Prop`, but it may be `Prop` for some parameter values"), but the kernel
  accepts it. The exported definition projects out its first field,
  `field : PUnit.{u}`.

  With the inductive flags of the kernel renovation (lean4#16595), whether a
  type has projections is the declared flag `hasProjections`, and whether it
  might be a proposition plays no role. `MaybeProp` is exported with
  `hasProjections` (as well as `hasEta` and `hasLargeElim`), which it may
  have: it has one constructor and no indices, and it is not impredicative, as
  its fields all live in `Sort u`. So the projection is valid, and a checker
  must accept it.

  Before the renovation, the outcome of this test was open. The official kernel
  accepted the projection, which is sound at every instantiation, while
  `MaybeProp.rec` eliminated into `Prop` only, so that the projection could not
  be expressed through the recursor
  (<https://github.com/leanprover/lean4/issues/7637>). A checker could
  reasonably reject it, for example by asking "could this be a proposition?"
  and then demanding that the field be definitely a proof. With `hasEta`,
  `MaybeProp.rec` now eliminates into every universe, so that mismatch is gone.
leanfile: tests/corner-cases/proj-maybe-prop.lean
export-decls: ["projMaybeProp"]
outcome: accept
