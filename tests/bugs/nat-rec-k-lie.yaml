description: |
  Proof of False via trusted `k` on `Nat.rec`.

  Lie by claiming `Nat.rec` is K-like. Then replace the major premise by `Nat.zero`,
  but nat literals bypasses K-like reduction, so two reduction rules disagree.

  `∀ n, g n` holds by the first, and `g 1` is `False` by the second.

  Origin: a variant of `bugs/rec-k-lie`, a soundness bug found in nanoda and its
  descendants (<https://github.com/leanprover/lean-kernel-arena/pull/83>). At that
  time, nanoda itself rejected this variant, as it had no literal path for `Nat.rec`.
file: tests/bugs/nat-rec-k-lie.ndjson
outcome: reject
