description: |
  Non-ASCII UTF-8 string literal reduction.

  In Lean's kernel, a string literal reduces to `String.ofList` of `Char.ofNat`
  applied to each Unicode scalar value, not each raw UTF-8 byte.  This test
  checks `"é€😀" = String.ofList [Char.ofNat 0xE9, Char.ofNat 0x20AC, Char.ofNat 0x1F600]`
  by reflexivity, covering 2-, 3-, and 4-byte UTF-8 sequences.

  rpylean rejected this test because `W_LitStr.build_str_expr` iterated raw
  UTF-8 bytes instead of decoding UTF-8 codepoints.
leanfile: tests/bugs/str-lit-utf8.lean
export-decls: ["strLitUtf8"]
outcome: accept
