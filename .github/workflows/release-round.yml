name: Release Round

on:
  # Closes a round: runs no checkers, but takes the results of a build of
  # master (see build-and-deploy.yml), renders them as the round, publishes
  # that as a release, tagging the commit round-<name>, and deposits it on
  # Zenodo for a DOI. Does not deploy — the round shows up under
  # /round/<name>/ with the next build of master.
  workflow_dispatch:
    inputs:
      round:
        description: 'Name of the round, e.g. 2026-10'
        required: true
        type: string
      commit:
        description: 'Commit to close the round on (default: that of the latest successful build of master)'
        required: false
        type: string
        default: ''
      test:
        description: 'Test round: tagged test-round-<name>, deposited on sandbox.zenodo.org and released as a pre-release, so it can be deleted again without leaving traces'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Where a closed round ends up on the published site. Mirrors ROUNDS_URL in
  # lka.py; this is the address a round is advertised and cited under, rather
  # than the release it happens to be distributed from.
  ARENA_ROUNDS_URL: https://arena.lean-lang.org/round

concurrency:
  # One round at a time, since each is deposited as a new version of the
  # previous one. Never cancelled: a run stopped halfway leaves a draft
  # deposition and a release to clean up.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  round-info:
    name: Determine round
    runs-on: ubuntu-latest
    permissions:
      # Not to write anything, but to see draft releases, which a release is
      # until its DOI is published
      contents: write
    outputs:
      # The round name, e.g. 2026-10
      round: ${{ steps.round.outputs.round }}
      # The tag the round is released under: round-<name>, or
      # test-round-<name> for a test round
      tag: ${{ steps.round.outputs.tag }}
      # 'true' for test rounds, which use sandbox.zenodo.org and are published
      # as GitHub pre-releases
      sandbox: ${{ steps.round.outputs.sandbox }}
    env:
      GH_TOKEN: ${{ github.token }}
      # This job has no checkout, so gh cannot infer the repository
      GH_REPO: ${{ github.repository }}
      ROUND: ${{ inputs.round }}
      SANDBOX: ${{ inputs.test }}
    steps:
      - name: Determine round
        id: round
        run: |
          round="$ROUND"
          # Rounds are named after a year and a month, e.g. 2026-10
          if ! [[ $round =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            echo "::error::Round name '$round' is not of the form YYYY-MM"
            exit 1
          fi
          if [ "$SANDBOX" = true ]; then
            sandbox=true; tag="test-round-$round"
          else
            sandbox=false; tag="round-$round"
            # A test round may try out the machinery from a branch, a real
            # round runs the one on master
            if [ "$GITHUB_REF" != refs/heads/master ]; then
              echo "::error::Close a real round from master, not from $GITHUB_REF"
              exit 1
            fi
          fi
          # Refuse to close a round that already has a release, before reserving
          # a DOI for it. A failed attempt deletes its own release again,
          # so one still being here means either the round was closed
          # successfully — re-running that would mint a second DOI for it — or
          # a run died without getting to clean up, which wants a look anyway.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::A release for $tag already exists. If round $round was closed successfully, do not re-run this workflow: it would create a second Zenodo record and DOI for the same round. If it is left over from a run that failed to clean up, delete it with 'gh release delete $tag --cleanup-tag' and run this workflow again."
            exit 1
          fi
          # The tag is created along with the release, and would silently be
          # reused rather than moved to the round's commit
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists without a release. Delete it with 'git push origin :refs/tags/$tag' and run this workflow again."
            exit 1
          fi
          echo "Closing round $round as $tag (sandbox=$sandbox)"
          {
            echo "round=$round"
            echo "tag=$tag"
            echo "sandbox=$sandbox"
          } >> "$GITHUB_OUTPUT"

  fetch-results:
    name: Fetch results of the round
    needs: round-info
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to find the build and download its artifacts
    outputs:
      # The commit the round is closed on
      sha: ${{ steps.find.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      # This job has no checkout, so gh cannot infer the repository
      GH_REPO: ${{ github.repository }}
      SANDBOX: ${{ needs.round-info.outputs.sandbox }}
    steps:
      # A round is what the build of its commit has as results (measured by
      # that build, or reused from earlier builds of master, see
      # fetch-previous-results.sh), so the round is rendered from that build's
      # data rather than by running everything again. A real round takes a build of master (pushed or dispatched); a
      # test round on a given commit takes any successful build of it,
      # including that of a pull request, so that it can exercise changes
      # still under review.
      - name: Find the build to close the round with
        id: find
        run: |
          strict='(.event == "push" or .event == "workflow_dispatch") and .headBranch == "master"'
          fields=databaseId,event,headBranch,headSha,url,createdAt,conclusion
          if [ -z "$COMMIT" ]; then
            filter="$strict"
            runs=$(gh run list --workflow build-and-deploy.yml --branch master \
              --limit 100 --json "$fields")
          else
            if [ "$SANDBOX" = true ]; then
              # Anything but builds of tags, which earlier versions of the
              # workflows made to close rounds and which have no results
              filter='.event != "push" or .headBranch == "master"'
            else
              filter="$strict"
            fi
            sha=$(gh api "repos/$GH_REPO/commits/$COMMIT" --jq .sha)
            runs=$(gh run list --workflow build-and-deploy.yml --commit "$sha" \
              --limit 100 --json "$fields")
          fi
          # Filtering on the conclusion here rather than with --status, which
          # was seen to leave out the most recent runs
          run=$(jq -c "map(select(.conclusion == \"success\" and ($filter))) | sort_by(.createdAt) | last // empty" <<< "$runs")
          if [ -z "$run" ]; then
            echo "::error::No successful build of ${COMMIT:-master} found to close the round with. A build superseded by a later push is cancelled; pick a commit whose build succeeded, or dispatch a build of it first."
            exit 1
          fi
          sha=$(jq -r .headSha <<< "$run")
          echo "Closing the round on $sha, with the results of $(jq -r .url <<< "$run")"
          {
            echo "sha=$sha"
            echo "run_id=$(jq -r .databaseId <<< "$run")"
          } >> "$GITHUB_OUTPUT"
        env:
          COMMIT: ${{ inputs.commit }}

      # Artifacts expire after 90 days, so close a round soon after its build
      - name: Download the build's artifacts
        run: |
          for name in site-results test-tarball tutorial-page; do
            gh run download "$RUN_ID" --name "$name" --dir "_round/$name"
          done
          find _round -maxdepth 2
        env:
          RUN_ID: ${{ steps.find.outputs.run_id }}

      - name: Check that the results are of the build's commit
        run: |
          revision=$(jq -r .meta.git_revision _round/site-results/results.json)
          if [ "$revision" != "$SHA" ]; then
            echo "::error::The results.json of the build is of commit $revision, not of the build's commit $SHA"
            exit 1
          fi
        env:
          SHA: ${{ steps.find.outputs.sha }}

      - name: Pass them on to the release
        uses: actions/upload-artifact@v7
        with:
          name: round-inputs
          path: _round
          overwrite: true

  zenodo-reserve:
    name: Reserve DOI on Zenodo
    needs: [round-info, fetch-results]
    # Only once the results of the round have been found: a DOI reserved for
    # a round that then fails is a draft deposition to clean up. The implicit
    # success() over `needs` covers that.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      doi: ${{ steps.reserve.outputs.doi }}
      deposition_id: ${{ steps.reserve.outputs.deposition_id }}
      bucket: ${{ steps.reserve.outputs.bucket }}
    env:
      GH_TOKEN: ${{ github.token }}
      ROUND: ${{ needs.round-info.outputs.round }}
      TAG: ${{ needs.round-info.outputs.tag }}
      SANDBOX: ${{ needs.round-info.outputs.sandbox }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Each round is deposited as a new version of the previous round, so that
      # all rounds share one concept DOI that resolves to the newest round.
      # The previous round records its deposition id in its own results.json.
      - name: Find the previous round's deposition
        id: previous
        run: |
          if [ "$SANDBOX" = true ]; then prefix=test-round-; else prefix=round-; fi
          # grep finds nothing before the first round exists, and pipefail
          # would turn that into a failure
          previous=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | { grep -E "^${prefix}[0-9]{4}-[0-9]{2}$" || true; } \
            | { grep -v "^${TAG}$" || true; } \
            | sort -r | head -1)
          if [ -z "$previous" ]; then
            echo "No previous round; this is the first deposition"
            echo "deposition=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Previous round: $previous"
          gh release download "$previous" --pattern '*-results.json' --dir _previous
          deposition=$(jq -r '.meta.zenodo_deposition // empty' _previous/*-results.json)
          if [ -z "$deposition" ]; then
            echo "::error::Round $previous has no Zenodo deposition recorded in its results.json"
            exit 1
          fi
          echo "Previous deposition: $deposition"
          echo "deposition=$deposition" >> "$GITHUB_OUTPUT"

      - name: Create draft deposition and reserve a DOI
        id: reserve
        run: |
          args=()
          if [ "$SANDBOX" = true ]; then args+=(--sandbox); fi
          args+=(reserve --round "$ROUND" --url "$ARENA_ROUNDS_URL/$ROUND/")
          if [ -n "$PREVIOUS" ]; then args+=(--previous-deposition "$PREVIOUS"); fi
          .github/zenodo.py "${args[@]}"
        env:
          PREVIOUS: ${{ steps.previous.outputs.deposition }}
          ZENODO_TOKEN: ${{ needs.round-info.outputs.sandbox == 'true' && secrets.ZENODO_SANDBOX_TOKEN || secrets.ZENODO_TOKEN }}

  release:
    name: Release the round
    needs: [round-info, fetch-results, zenodo-reserve]
    runs-on: ubuntu-latest

    permissions:
      contents: write # to create the release

    env:
      GH_TOKEN: ${{ github.token }}
      ROUND: ${{ needs.round-info.outputs.round }}
      TAG: ${{ needs.round-info.outputs.tag }}
      SHA: ${{ needs.fetch-results.outputs.sha }}
      SANDBOX: ${{ needs.round-info.outputs.sandbox }}

    steps:
      # The commit the results are of, so the site is rendered by the code
      # that produced them
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.fetch-results.outputs.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup nix shell
        run: "true"
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Fetch the results of the round
        uses: actions/download-artifact@v8
        with:
          name: round-inputs
          path: _round

      # Keeps the timestamp and the build link of results.json, which now say
      # when and by which run the round was assembled; each result says when
      # and by which run it was measured
      - name: Generate website
        run: |
          mkdir -p _out
          cp -r _round/tutorial-page _out/tutorial
          ./lka.py build-site \
            --results _round/site-results/results.json \
            --tarball _round/test-tarball/lean-arena-tests.tar.gz \
            --round "$ROUND" --tag "$TAG" --doi "$DOI" --zenodo-deposition "$DEPOSITION"
        shell: 'nix develop -c bash -euxo pipefail {0}'
        env:
          DOI: ${{ needs.zenodo-reserve.outputs.doi }}
          DEPOSITION: ${{ needs.zenodo-reserve.outputs.deposition_id }}

      # Publish the round: the site as one tarball, plus results.json and the
      # test suite separately, which are the two things people actually want to
      # download. Every asset is named after its round, since they are read far
      # away from the release page that would otherwise say which round they
      # are. The site tarball leaves the other two out; the copy that master
      # builds assemble under /round/<name>/ puts them back under the names
      # the archived page links to.
      - name: Pack the round
        run: |
          mkdir -p /tmp/round
          prefix="lean-arena-round-$ROUND"
          tar -czf "/tmp/round/$prefix-site.tar.gz" \
            --exclude=results.json \
            --exclude=lean-arena-tests.tar.gz \
            --transform "s,^\\.,$prefix-site," \
            -C _out .
          cp _out/results.json "/tmp/round/$prefix-results.json"
          cp _out/lean-arena-tests.tar.gz "/tmp/round/$prefix-tests.tar.gz"
          ls -l /tmp/round
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Create the release
        run: |
          prefix="lean-arena-round-$ROUND"
          # An existing release is refused by round-info, not replaced here: a
          # release that survived a failed attempt is indistinguishable from
          # the release of a round that closed successfully, and silently
          # replacing the latter would mint a second DOI for the same round.
          # Send readers to the round on the site rather than leaving them with
          # three tarballs; the assets stay here for downloading and archiving.
          notes="Round $ROUND of the Lean Kernel Arena: $ARENA_ROUNDS_URL/$ROUND/"
          args=(--title "Round $ROUND" --notes "$notes")
          if [ "$SANDBOX" = true ]; then args+=(--prerelease); fi
          # A draft until the DOI is published (see zenodo-publish), so that
          # neither a build of master nor anyone else picks up a round that
          # may still be discarded. Publishing the draft creates the tag on
          # the round's commit.
          gh release create "$TAG" --draft --target "$SHA" "${args[@]}" \
            "/tmp/round/$prefix-site.tar.gz" \
            "/tmp/round/$prefix-results.json" \
            "/tmp/round/$prefix-tests.tar.gz"

      - name: Upload the round to Zenodo
        run: |
          prefix="lean-arena-round-$ROUND"
          args=()
          if [ "$SANDBOX" = true ]; then args+=(--sandbox); fi
          .github/zenodo.py "${args[@]}" upload --bucket "$BUCKET" \
            "/tmp/round/$prefix-site.tar.gz" \
            "/tmp/round/$prefix-results.json" \
            "/tmp/round/$prefix-tests.tar.gz"
        env:
          BUCKET: ${{ needs.zenodo-reserve.outputs.bucket }}
          ZENODO_TOKEN: ${{ needs.round-info.outputs.sandbox == 'true' && secrets.ZENODO_SANDBOX_TOKEN || secrets.ZENODO_TOKEN }}

      # Leave nothing half-published behind. The draft would otherwise linger
      # on Zenodo holding a DOI that is never published, and the release would
      # advertise a results.json pointing at that discarded draft — which the
      # next round would then try to build its version chain on.
      # Cancellation counts: a run stopped between creating the release and
      # publishing leaves exactly the half-published state this prevents.
      - name: Discard the round on failure
        if: ${{ (failure() || cancelled()) && needs.zenodo-reserve.outputs.deposition_id }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || echo "No release to delete"
          args=()
          if [ "$SANDBOX" = true ]; then args+=(--sandbox); fi
          .github/zenodo.py "${args[@]}" discard --deposition "$DEPOSITION"
        env:
          DEPOSITION: ${{ needs.zenodo-reserve.outputs.deposition_id }}
          ZENODO_TOKEN: ${{ needs.round-info.outputs.sandbox == 'true' && secrets.ZENODO_SANDBOX_TOKEN || secrets.ZENODO_TOKEN }}

  zenodo-publish:
    name: Publish DOI on Zenodo
    needs: [round-info, release, zenodo-reserve]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the release
    # Publishing mints the DOI and cannot be undone, so this runs as its own
    # job: it only starts once the release job has succeeded, i.e. once the
    # draft release exists and the deposition is complete. Practice with a
    # test round, which does all of this against sandbox.zenodo.org.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Just before minting the DOI, which the release pages cite, rather than
      # after it: a release that fails to be published can be retried, a DOI
      # cannot be minted twice. Idempotent, so re-running this job is safe.
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.round-info.outputs.tag }}

      - name: Publish the deposition
        run: |
          args=()
          if [ "$SANDBOX" = true ]; then args+=(--sandbox); fi
          .github/zenodo.py "${args[@]}" publish --deposition "$DEPOSITION" --expect-doi "$DOI"
        env:
          SANDBOX: ${{ needs.round-info.outputs.sandbox }}
          DEPOSITION: ${{ needs.zenodo-reserve.outputs.deposition_id }}
          DOI: ${{ needs.zenodo-reserve.outputs.doi }}
          ZENODO_TOKEN: ${{ needs.round-info.outputs.sandbox == 'true' && secrets.ZENODO_SANDBOX_TOKEN || secrets.ZENODO_TOKEN }}

  deploy:
    name: Deploy site with the round
    needs: [fetch-results, zenodo-publish]
    # Renders and deploys the live site just as the build of master would, so
    # that the round is on it right away rather than with the next build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.fetch-results.outputs.sha }}

    steps:
      # Only if the round's commit is still the head of master: otherwise a
      # newer build of master deploys the round, and deploying the round's
      # results now could even roll the site back past that build. Checked
      # last thing before deploying, since master may have moved while the
      # round was being closed. Pages deploy only from master anyway.
      - name: Check that the round is of the head of master
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          if [ "$GITHUB_REF" = refs/heads/master ] && [ "$head" = "$SHA" ]; then
            echo "DEPLOY=true" >> "$GITHUB_ENV"
          else
            echo "::notice::Not deploying: the round is of $SHA, master is at $head (dispatched from $GITHUB_REF). The round appears on the site with the next build of master."
            echo "DEPLOY=false" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        if: env.DEPLOY == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.fetch-results.outputs.sha }}

      - name: Install Nix
        if: env.DEPLOY == 'true'
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@v6

      - name: Setup nix shell
        if: env.DEPLOY == 'true'
        run: "true"
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Fetch the results of the round
        if: env.DEPLOY == 'true'
        uses: actions/download-artifact@v8
        with:
          name: round-inputs
          path: _round

      # The site of the round in progress, as the build of master rendered it
      - name: Generate website
        if: env.DEPLOY == 'true'
        run: |
          mkdir -p _out
          cp -r _round/tutorial-page _out/tutorial
          ./lka.py build-site \
            --results _round/site-results/results.json \
            --tarball _round/test-tarball/lean-arena-tests.tar.gz
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Assemble closed rounds
        if: env.DEPLOY == 'true'
        run: .github/assemble-rounds.sh _out
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Add analytics to the deployed pages
        if: env.DEPLOY == 'true'
        run: .github/add-analytics.py templates/analytics.html _out
        shell: 'nix develop -c bash -euxo pipefail {0}'

      # Per attempt, see build-and-deploy.yml
      - name: Upload artifact
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: '_out'

      - name: Deploy to GitHub Pages
        if: env.DEPLOY == 'true'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
