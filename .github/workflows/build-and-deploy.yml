name: Build and Deploy Site

on:
  workflow_dispatch: # Manual trigger; on master, also deploys the site
  pull_request: # Run on pull requests
  push:
    branches:
      # Builds and deploys the site
      - master

permissions:
  contents: read

concurrency:
  # One group per ref. A new push to a pull request or to master supersedes
  # the build still running for it, and deploying a site that is already
  # outdated is not worth waiting for.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-checkers:
    name: Select checkers
    runs-on: ubuntu-latest
    outputs:
      checkers: ${{ steps.select.outputs.checkers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # On pull requests, check out the PR head instead of the artificial
          # merge commit (empty ref means default behavior otherwise)
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history, to compute the merge base of a pull request
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup nix shell
        run: "true"
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Select checkers to run
        id: select
        run: .github/checker-matrix.sh >> "$GITHUB_OUTPUT"
        shell: 'nix develop -c bash -euxo pipefail {0}'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  check:
    name: 'Checker: ${{ matrix.checker }}'
    needs: select-checkers
    # Namespace runner: unlike GitHub-hosted runners it exposes a vPMU,
    # so perf instruction counts work (user-space-only at paranoid=2)
    runs-on:
      # The cache volume is shared by all jobs that build tests. Bump the tag's
      # suffix to start over with an empty volume.
      - nscloud-ubuntu-22.04-amd64-8x16-with-cache
      - nscloud-cache-tag-lka-tests-v2
      - nscloud-cache-size-50gb
      # Only master writes the volume back; pull requests read it
      - nscloud-cache-allow-commit-from-master
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        checker: ${{ fromJSON(needs.select-checkers.outputs.checkers) }}
    env:
      CHECKER: ${{ matrix.checker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # On pull requests, check out the PR head instead of the artificial
          # merge commit (empty ref means default behavior otherwise)
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Mount cache volume
        uses: ./.github/actions/cache-volume

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup nix shell
        run: "true"
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Check perf support
        run: |
          echo "=== System info ==="
          uname -a || true
          echo "=== perf binary ==="
          if command -v perf >/dev/null 2>&1; then
            perf --version || true
          else
            echo "perf not installed"
          fi
          echo "=== kernel perf settings ==="
          for f in /proc/sys/kernel/perf_event_paranoid /proc/sys/kernel/kptr_restrict; do
            if [ -f "$f" ]; then
              printf "%s: %s\n" "$f" "$(cat $f)"
            else
              printf "%s: (missing)\n" "$f"
            fi
          done
          echo "=== software event, own process (works even without PMU) ==="
          perf stat -e task-clock -- true 2>&1 || echo "software event failed"
          echo "=== hardware event, own process (allowed at paranoid=2 if a PMU exists) ==="
          perf stat -e cycles,instructions -- true 2>&1 || echo "hardware event failed"
          echo "=== try lowering perf_event_paranoid via sudo ==="
          if sudo sysctl -w kernel.perf_event_paranoid=-1 2>&1; then
            echo "=== hardware event after sysctl ==="
            perf stat -e cycles,instructions -- true 2>&1 || echo "hardware event still failing (likely no vPMU)"
            echo "=== system-wide after sysctl ==="
            perf stat -e cycles -a -- true 2>&1 || echo "system-wide still failing"
          else
            echo "sudo sysctl not permitted"
          fi
        shell: 'nix develop -c bash -euxo pipefail {0}'
        continue-on-error: true

      - name: Build checker
        run: ./lka.py build-checker "$CHECKER"
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Generate tests
        run: ./lka.py build-test --cache --skip-declined-by "$CHECKER" ${{ github.event_name == 'pull_request' && '--skip-ci' || '' }}
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Run checker on tests
        run: ./lka.py run --checker "$CHECKER"
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Cache volume stats
        if: always()
        run: .github/cache-stats.sh "${{ matrix.checker }}"

      - name: Stage results for upload
        run: ./lka.py ci-pack --outdir /tmp/artifact --results
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.checker }}
          path: /tmp/artifact
          # Re-running a job must not trip over the artifact of its previous
          # attempt, which is kept in the same run
          overwrite: true

  tutorial:
    name: Build tutorial page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # On pull requests, check out the PR head instead of the artificial
          # merge commit (empty ref means default behavior otherwise)
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup nix shell
        run: "true"
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Build tutorial tests
        run: ./lka.py build-test tutorial
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Build tutorial test viewer
        run: |
          cd test-printer
          lake build
          lake exe test-printer ../_build/tests/tutorial/ ../_out/tutorial/index.html
        shell: 'nix develop -c bash -euxo pipefail {0}'

      # This and the other artifacts a round is built from (see
      # release-round.yml) overwrite their namesakes from earlier attempts, so
      # that a run has exactly one of each
      - name: Upload tutorial page
        uses: actions/upload-artifact@v7
        with:
          name: tutorial-page
          path: _out/tutorial
          overwrite: true

  test-stats:
    name: Build test stats and tarball
    runs-on:
      # The cache volume is shared by all jobs that build tests. Bump the tag's
      # suffix to start over with an empty volume.
      - nscloud-ubuntu-22.04-amd64-8x16-with-cache
      - nscloud-cache-tag-lka-tests-v2
      - nscloud-cache-size-50gb
      # Only master writes the volume back; pull requests read it
      - nscloud-cache-allow-commit-from-master
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # On pull requests, check out the PR head instead of the artificial
          # merge commit (empty ref means default behavior otherwise)
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Mount cache volume
        uses: ./.github/actions/cache-volume

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup nix shell
        run: "true"
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Generate tests
        run: ./lka.py build-test --cache ${{ github.event_name == 'pull_request' && '--skip-ci' || '' }}
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Build test tarball
        run: ./lka.py build-tarball
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Cache volume stats
        if: always()
        run: .github/cache-stats.sh "test-stats"

      - name: Stage test stats for upload
        run: ./lka.py ci-pack --outdir /tmp/artifact --test-stats
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Upload test stats
        uses: actions/upload-artifact@v7
        with:
          name: test-stats
          path: /tmp/artifact
          overwrite: true

      - name: Upload test tarball
        uses: actions/upload-artifact@v7
        with:
          name: test-tarball
          path: _out/lean-arena-tests.tar.gz
          overwrite: true

  build-site:
    name: Build and deploy site
    needs: [check, tutorial, test-stats]
    # Run even if some checker jobs failed, so the site is still built and can
    # be inspected in the uploaded artifact. It is only deployed if every
    # checker succeeded, and a final step below then fails this job.
    if: ${{ !cancelled() && needs.check.result != 'skipped' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    env:
      GH_TOKEN: ${{ github.token }}
      # Only builds of master go live
      DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # On pull requests, check out the PR head instead of the artificial
          # merge commit (empty ref means default behavior otherwise)
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@v6

      - name: Setup nix shell
        run: "true"
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Fetch checker results
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: _artifacts

      - name: Fetch test stats
        uses: actions/download-artifact@v8
        with:
          name: test-stats
          path: _artifacts/test-stats

      - name: Merge checker results and test stats
        run: ./lka.py ci-merge _artifacts/*
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Fetch tutorial page
        uses: actions/download-artifact@v8
        with:
          name: tutorial-page
          path: _out/tutorial

      - name: Fetch test tarball
        uses: actions/download-artifact@v8
        with:
          name: test-tarball
          path: _tarball

      - name: Generate website
        run: ./lka.py build-site --tarball _tarball/lean-arena-tests.tar.gz
        shell: 'nix develop -c bash -euxo pipefail {0}'

      # The data of this build, from which a round closed on this commit is
      # rendered (see release-round.yml)
      - name: Upload results.json
        uses: actions/upload-artifact@v7
        with:
          name: site-results
          path: _out/results.json
          overwrite: true

      # Only deploying runs need the archive of closed rounds, and a round
      # becomes visible on the site with the next one (or right away, if
      # release-round.yml can deploy it)
      - name: Assemble closed rounds
        if: env.DEPLOY == 'true'
        run: .github/assemble-rounds.sh _out
        shell: 'nix develop -c bash -euxo pipefail {0}'

      # Taken before the analytics snippet goes in, so the standalone report is
      # as free of it as the round tarballs are.
      - name: Generate self-contained report
        run: monolith _out/index.html -o /tmp/report.html -i -F -e -M -q
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: report.html
          path: '/tmp/report.html'
          archive: false
          overwrite: true

      # Last thing before the pages leave the runner, so that only the deployed
      # copy carries it: not the round tarballs, not the Zenodo deposits, not
      # the report above.
      - name: Add analytics to the deployed pages
        if: env.DEPLOY == 'true'
        run: .github/add-analytics.py templates/analytics.html _out
        shell: 'nix develop -c bash -euxo pipefail {0}'

      # Give each run attempt its own artifact name. Re-running only this job
      # leaves the previous attempt's artifact in place; a fixed name would then
      # collide and deploy-pages aborts with "Multiple artifacts named
      # github-pages". A per-attempt name makes restarts collision-free.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: '_out'

      # Only put a complete site live. A checker job that failed did not
      # produce results, and the site does not distinguish a checker without
      # results from one that was never run, so deploying would quietly drop
      # that checker from the published page. Re-run the failed job instead.
      - name: Deploy to GitHub Pages
        if: ${{ env.DEPLOY == 'true' && needs.check.result == 'success' }}
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # The checker matrix uses fail-fast: false, so a failing checker does not
      # stop the others and the site is still built above. Surface the failure
      # by failing this final job once everything else is done.
      - name: Fail if any checker job failed
        if: ${{ always() && needs.check.result != 'success' }}
        run: |
          echo "::error::Checker jobs did not all succeed (${{ needs.check.result }}), so the site was not deployed; see the 'Checker: …' matrix jobs."
          exit 1
